name: Create signing key (run ONCE)

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create encrypted keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "ОШИБКА: сначала создай секрет KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"; exit 1; fi
          if [ ${#KS_PASS} -lt 16 ]; then echo "ОШИБКА: пароль должен быть не короче 16 символов"; exit 1; fi
          if [ -f keystore.enc ]; then echo "Ключ уже существует (keystore.enc). Не перезаписываю, иначе потеряешь возможность обновлять игру."; exit 1; fi
          keytool -genkeypair -keystore ks.p12 -storetype PKCS12 -alias nikomito \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Nikomito Stars, O=Nikomito, C=RU"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in ks.p12 -out keystore.enc -pass env:KS_PASS
          rm -f ks.p12
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add keystore.enc
          git commit -m "Add encrypted signing key"
          git push
          echo "Готово: keystore.enc сохранён в репозитории (зашифрован твоим паролем)."
