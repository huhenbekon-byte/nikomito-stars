.hit{position:absolute;z-index:2;border:0;background:transparent;padding:0;cursor:pointer;border-radius:8px}.hit:hover{background:#ffffff12}.hit:focus-visible{outline:3px solid white}



#fighterBack{left:0;top:0;width:9.5%;height:10.5%}#fighterGems{left:68.5%;top:1%;width:14.5%;height:8.5%}#fighterChat{left:84%;top:1%;width:8%;height:10%}#fighterHome{left:91.5%;top:0;width:8.5%;height:10.5%}
.fcard{top:24%;height:56%;width:22.5%;border-radius:3%}#f0{left:3%}#f1{left:27.3%}#f2{left:51.6%}#f3{left:75.8%}#fighterBackBottom{left:1.5%;top:87%;width:20%;height:12%}
#toast{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#0008;padding:14px}#toast.show{display:flex}.dialog{width:min(460px,94%);max-height:90%;overflow:auto;background:linear-gradient(#604658,#302331);border:4px solid #17131b;border-radius:15px;padding:20px;text-align:center;box-shadow:0 7px #650b17;font-size:clamp(14px,1.6vw,20px);font-weight:900}.dialog h2{margin:0 0 12px;font-size:1.35em}.dialog p{font-weight:700;line-height:1.4}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{padding:9px 14px;background:linear-gradient(#26baff,#0870d4);color:#fff;border:3px solid #19151e;border-radius:9px;font-size:1em;font-weight:1000;cursor:pointer}.actions button.warn{background:linear-gradient(#ff6565,#b70d1b)}
#toast input{width:100%;padding:10px;border-radius:8px;border:2px solid #222;font-size:1em}
@media(max-width:600px){.dialog{padding:14px}.actions button{padding:7px 10px}}
#app{container-type:inline-size}.ov{position:absolute;z-index:1;display:flex;align-items:center;text-align:center;font-weight:900;font-family:"Arial Black",Arial,sans-serif;line-height:1.12;white-space:nowrap;pointer-events:none;paint-order:stroke fill;-webkit-text-stroke-color:#190f1c}.ov i{font-style:normal;color:#ff3b3b}

#battle,#room,#offer,#league,#birthdayGems,#birthdayTrophies,#smallBox,#bigBox,#specialBox,#epicBox,
#battle::after,#offer::after,#birthdayGems::after,#birthdayTrophies::after,#league::after{content:"";position:absolute;inset:0;border-radius:12px;animation:glow 1.6s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{box-shadow:inset 0 0 2.5cqw #ffe27a,0 0 2.5cqw #ffe27a88}}

@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
#epicBox::before{animation-delay:.5s}#legendBox::before{animation-delay:1s}#bigBox::before{animation-delay:.7s}.fcard.hit{overflow:hidden}
#toast.show{animation:fin .2s}@keyframes fin{from{opacity:0}}#toast.show .dialog{animation:dpop .4s cubic-bezier(.2,1.7,.4,1)}@keyframes dpop{from{transform:scale(.4) rotate(-4deg);opacity:0}}

.ovimg{position:absolute;z-index:1;border-radius:14%;border:.25cqw solid #190f1c;object-fit:cover;pointer-events:none}

function save(){localStorage.setItem('nikomitoSave',JSON.stringify(data));render()}
function screen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(name+'Screen').classList.add('active');close()}
function popup(title,body,buttons=[['ЗАКРЫТЬ',close]]){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialogActions').innerHTML='';buttons.forEach(([label,fn,cls])=>{let b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;$('dialogActions').appendChild(b)});$('toast').classList.add('show')}
function close(){$('toast').classList.remove('show')}
function gainTrophies(n){data.trophies+=n;fighters.forEach(f=>{if(data.trophies>=f.need&&!data.unlocked.includes(f.name))data.unlocked.push(f.name)});save()}
function choose(i){let f=fighters[i];if(!data.unlocked.includes(f.name)){if(data.trophies>=f.need){data.unlocked.push(f.name);save();popup(f.name+' ОТКРЫТ',f.desc+'<p>Теперь боец доступен для выбора.</p>',[['ВЫБРАТЬ',()=>{data.selected=f.name;save();popup(f.name+' ВЫБРАН','Боец будет использоваться в следующем матче.')}],['ЗАКРЫТЬ',close]])}else popup(f.name+' ЗАКРЫТ',`Собери <b>${f.need}</b> кубков, чтобы открыть бойца.<p>Сейчас у тебя: <b>${data.trophies}</b> 🏆</p>`,[['СЫГРАТЬ БОЙ',battle],['ЗАКРЫТЬ',close]]);return}data.selected=f.name;save();popup(f.name+' ВЫБРАН',f.desc+'<p>Боец выбран для следующего матча.</p>')}
function battle(){close();if(data.keys<=0){popup('НЕТ КЛЮЧЕЙ','Ключи закончились.');return}data.keys--;gainTrophies(5);data.gems+=2;save();popup('ПОБЕДА!',`Боец: <b>${data.selected||'Жен'}</b><p>+5 🏆　+2 💎</p><p>Кубки: ${data.trophies}　Ключи: ${data.keys}</p>`)}
function buy(name,cost){if(data.gems<cost){popup('НЕ ХВАТАЕТ КРИСТАЛЛОВ',`Для покупки «${name}» нужно <b>${cost} 💎</b>.<p>Твой баланс: ${data.gems} 💎</p>`);return}data.gems-=cost;save();popup('ПОКУПКА УСПЕШНА',`Ты купил: <b>${name}</b>.<p>Остаток: ${data.gems} 💎</p><p>В коробке может быть <b>Кубик Рубик</b> (шанс 25%)!</p>`,[['ОТКРЫТЬ КОРОБКУ',()=>openBox(name)],['ЗАКРЫТЬ',close]])}
$('mainShop').onclick=()=>screen('shop');$('mainBrawlers').onclick=()=>screen('fighter');$('mainGame').onclick=()=>screen('main');
$('shopBack').onclick=$('shopHome').onclick=$('fighterHome').onclick=()=>screen('main');$('fighterBack').onclick=$('fighterBackBottom').onclick=()=>screen('main');
$('shopChat').onclick=$('fighterChat').onclick=()=>popup('ЧАТ','Чат пока недоступен в локальной версии.');
$('fighterGems').onclick=$('gemCount').onclick=()=>popup('КРИСТАЛЛЫ',`Баланс: <b>${data.gems} 💎</b>`);
$('f0').onclick=()=>choose(0);$('f1').onclick=()=>choose(1);$('f2').onclick=()=>choose(2);$('f3').onclick=()=>choose(3);
$('practice').onclick=()=>popup('ТРЕНИРОВКА','Тренировочный матч без расхода ключей.',[['НАЧАТЬ',()=>popup('ТРЕНИРОВКА','Тренировка завершена. Награды не начисляются.')],['ЗАКРЫТЬ',close]]);
$('battle').onclick=battle;
$('room').onclick=()=>{data.roomCount++;save();let code='NIKO-'+String(1000+data.roomCount);popup('НОВАЯ ИГРОВАЯ КОМНАТА',`Комната создана.<p>Код: <b>${code}</b></p><p>Это локальная демоверсия без сетевого подключения.</p>`,[['КОПИРОВАТЬ КОД',()=>{if(navigator.clipboard)navigator.clipboard.writeText(code);popup('КОД КОМНАТЫ',code)}],['ЗАКРЫТЬ',close]])};
$('league').onclick=()=>{if(data.trophies<3){popup('НАГРАДА ЛИГИ','Для получения награды нужно 3 кубка.');return}data.trophies-=3;data.gems+=10;save();popup('НАГРАДА ПОЛУЧЕНА','Ты получил 10 кристаллов!')};
$('birthdayGems').onclick=()=>{if(data.giftGems){popup('ПОДАРОК УЖЕ ПОЛУЧЕН','Этот подарок можно получить только один раз.');return}data.giftGems=true;data.gems+=10;save();popup('ПОДАРОК ПОЛУЧЕН','Ты получил 10 кристаллов!')};
$('birthdayTrophies').onclick=()=>{if(data.giftTrophies){popup('ПОДАРОК УЖЕ ПОЛУЧЕН','Этот подарок можно получить только один раз.');return}data.giftTrophies=true;gainTrophies(5);save();popup('ПОДАРОК ПОЛУЧЕН','Ты получил 5 кубков!')};
$('offer').onclick=()=>{if(data.offerBought){popup('ПРЕДЛОЖЕНИЕ УЖЕ КУПЛЕНО','Подарок дня рождения доступен один раз.');return}if(data.gems<19){popup('НЕ ХВАТАЕТ КРИСТАЛЛОВ','Нужно 19 💎.');return}data.gems-=19;data.offerBought=true;save();openBox('Коробка дня рождения')};
$('smallBox').onclick=()=>buy('Малая коробка',30);$('bigBox').onclick=()=>buy('Большая коробка',80);$('specialBox').onclick=()=>buy('Особая коробка',30);$('epicBox').onclick=()=>buy('Эпическая коробка',80);$('legendBox').onclick=()=>buy('Легендарная коробка',170);
$('admin').onclick=()=>popup('АДМИН-ПАНЕЛЬ',`Кристаллы: ${data.gems}<br>Кубки: ${data.trophies}<br>Уровень: ${data.level}`,[['+100 💎',()=>{data.gems+=100;save();popup('АДМИН','Добавлено 100 кристаллов.')}],['+10 🏆',()=>{gainTrophies(10);popup('АДМИН','Добавлено 10 кубков.')}],['СБРОСИТЬ ПРОГРЕСС',()=>{resetProg()}],['ЗАКРЫТЬ',close,'warn']]);
$('profile').onclick=()=>popup('ПРОФИЛЬ',`Игрок: <b>Nikomito</b><p>Уровень: ${data.level}</p><p>Кубки: ${data.trophies}</p><p>Выбранный боец: ${data.selected||'нет'}</p>`);
$('toast').addEventListener('click',e=>{if(e.target===$('toast'))close()});
function render(){
['gemsMain','gemsShop','gemsFighter'].forEach(i=>$(i).textContent=data.gems);
$('keysMain').textContent=data.keys+'/24';
$('leagueMain').textContent=Math.min(data.trophies,3)+'/3';
$('giftG').textContent=data.giftGems?'0':'10';
$('giftT').textContent=data.giftTrophies?'0':'5';
$('brawlerCount').textContent=data.unlocked.length;
}
const modeNames=['Захват кристаллов', 'Столкновение', 'Осада', 'Особое событие'];
modeNames.forEach((n,i)=>{$('mode'+i).onclick=()=>popup('БОЙ НЕДОСТУПЕН',`Режим «${n}» скоро будет доступен.<p>Пока можно играть в Ограбление.</p>`)});

let AC=null;
function au(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty='square',v=.07,sl=0,dl=0){const a=au();if(!a||data.mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.1,hp=800){const a=au();if(!a||data.mute)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='highpass';f.frequency.value=hp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
function sfx(n,x){try{switch(n){
case'click':tone(660,.07,'square',.05,300);break;case'pop':tone(400,.12,'triangle',.09,500);break;case'whoosh':noise(.2,.05,1500);break;
case'coin':tone(988,.08,'square',.06);tone(1319,.18,'square',.06,0,.08);break;
case'win':[523,659,784,1047].forEach((f,i)=>tone(f,.22,'square',.07,0,i*.13));break;
case'lose':[400,330,262].forEach((f,i)=>tone(f,.28,'sawtooth',.06,-40,i*.16));break;
case'shoot':if(x==='snip'){tone(900,.15,'sawtooth',.06,-700);noise(.1,.05,2000)}else if(x==='gren')tone(300,.2,'triangle',.09,-150);else if(x==='shot'){noise(.14,.09,900);tone(200,.1,'square',.05,-100)}else tone(700,.06,'square',.04,-300);break;
case'hit':tone(180,.1,'sawtooth',.06,-80);break;case'hurtp':tone(120,.2,'sawtooth',.1,-60);noise(.1,.07,300);break;
case'boom':noise(.4,.16,200);tone(90,.35,'sawtooth',.12,-60);break;case'ko':tone(500,.3,'sawtooth',.08,-420);noise(.25,.09,500);break;
case'crate':noise(.15,.09,600);tone(250,.1,'square',.04,-100);break;case'cube':tone(700,.08,'triangle',.09,500);tone(1100,.12,'triangle',.09,0,.07);break;
case'beep':tone(520,.15,'square',.08);break;case'go':tone(1040,.35,'square',.09);break}}catch(e){}}

async function hp(p,salt){const s=salt+':'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return'f'+h.toString(16)}}
